name: Bug report
description: Report incorrect or unexpected behaviour
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Exact commands, input, and configuration needed to reproduce the problem.
      placeholder: |
        1. Run `depsls ...`
        2. Observe ...
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: depsls version
      description: Output of `depsls --version`, or the release tag / commit you built from.
    validations:
      required: true

  - type: input
    id: toolchain
    attributes:
      label: Rust toolchain
      description: Output of `rustc --version` (only needed if you built from source).
    validations:
      required: false

  - type: input
    id: platform
    attributes:
      label: Operating system and architecture
      placeholder: e.g. Ubuntu 24.04 x86_64, macOS 15 arm64, Windows 11 x86_64
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Relevant output. It will be rendered as a code block, no backticks needed.
      render: shell
    validations:
      required: false
