[package]
name = "depsls"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Language server that reports available dependency updates in project manifests, using the deps.dev API"
repository = "https://github.com/pixel365/depsls"
license = "MIT"
readme = "README.md"
keywords = ["lsp", "language-server", "dependencies", "outdated"]
categories = ["development-tools"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[dependencies]
